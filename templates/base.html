<!DOCTYPE html>
<html>

<head>
    <title>Ledger - Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
    {% if session_email %}
    <header class="topbar">
        <span class="wordmark">LEDGER.</span>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/add_expense">Add Expense</a>
            <a href="/set-budget">Set Budget</a>
            <a href="/logout">Log Out ({{ session_email }})</a>

        </nav>
    </header>
    {% endif %}
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
